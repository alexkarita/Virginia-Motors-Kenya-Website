<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login – Virginia Motors</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#f5f5f5;font-family:'Barlow',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1e1e1e;border:1px solid #222;border-radius:8px;padding:48px;width:100%;max-width:400px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:4px;text-align:center;margin-bottom:8px}
.logo span{color:#e63329}
.subtitle{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#888;text-align:center;margin-bottom:32px}
.flash{padding:10px 14px;border-radius:4px;font-size:13px;margin-bottom:18px;background:#3a1a1a;border-left:3px solid #e63329;color:#ff9090}
label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:6px}
input{width:100%;background:#2a2a2a;border:1px solid #333;color:#f5f5f5;padding:12px 14px;border-radius:4px;font-size:14px;margin-bottom:16px}
input:focus{outline:none;border-color:#e63329}
button{width:100%;background:#e63329;color:#fff;border:none;padding:14px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:2px;font-weight:700;cursor:pointer;text-transform:uppercase}
button:hover{background:#b82820}
.back{display:block;text-align:center;margin-top:18px;color:#555;font-size:13px;text-decoration:none}
.back:hover{color:#f5f5f5}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span>VIRGINIA</span> MOTORS</div>
  <div class="subtitle">Admin Login</div>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" placeholder="virginia@virginiamotors.co.ke" required autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
    <button type="submit">Sign In</button>
  </form>
  <a class="back" href="/">← Back to website</a>
</div>
</body>
</html>
